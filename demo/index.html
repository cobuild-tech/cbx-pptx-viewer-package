<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pptx-viewer — demo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, sans-serif;
        background: #1e1e2e;
        color: #e6e6e6;
      }
      #editor { padding: 16px 20px; }
      #editbar {
        display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        padding: 8px; background: #2a2a3e; border-radius: 8px 8px 0 0;
      }
      #editbar button, #editbar select, #editbar input {
        padding: 4px 9px; border-radius: 6px; border: 1px solid #555;
        background: #3a3a4e; color: #e6e6e6; cursor: pointer; font: inherit;
      }
      #editbar button:disabled { opacity: .4; cursor: default; }
      #editbar .sep { width: 1px; align-self: stretch; background: #555; margin: 0 3px; }
      #stage { height: 60vh; background: #525659; border-radius: 0 0 8px 8px; overflow: hidden; }
      .hint { color: #9a9ab0; font-size: 13px; }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      #drop {
        margin: 20px;
        padding: 40px;
        border: 2px dashed #555;
        border-radius: 10px;
        text-align: center;
        color: #aaa;
        transition: border-color 0.15s, background 0.15s;
      }
      #drop.over { border-color: #7aa2f7; background: #2a2a40; color: #fff; }
      #info { margin: 0 20px 20px; }
      .meta { color: #9ece6a; margin-bottom: 12px; white-space: pre-wrap; }
      table { border-collapse: collapse; width: 100%; font-size: 12px; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a2a3a; }
      th { color: #7aa2f7; position: sticky; top: 0; background: #1e1e2e; }
      td.ct { color: #888; }
      code { color: #e0af68; }
    </style>
  </head>
  <body>
    <header>
      <h1>pptx-viewer</h1>
      <input type="file" id="file" accept=".pptx" />
    </header>
    <div id="drop">Drop a <code>.pptx</code> file here, or use the picker above.</div>
    <div id="editor" hidden>
      <div id="editbar">
        <button data-fmt="bold"><b>B</b></button>
        <button data-fmt="italic"><i>I</i></button>
        <button data-fmt="underline"><u>U</u></button>
        <button data-fmt="strike"><s>S</s></button>
        <select id="size" title="Font size"></select>
        <input type="color" id="color" title="Text colour" />
        <span class="sep"></span>
        <button id="undo" title="Undo">&#8630;</button>
        <button id="redo" title="Redo">&#8631;</button>
        <span class="sep"></span>
        <label style="display:flex;align-items:center;gap:5px;">
          Boxes
          <select id="outline" title="Outline editable text boxes">
            <option value="hover">on hover</option>
            <option value="always">always</option>
            <option value="none">focused only</option>
          </select>
        </label>
        <span class="sep"></span>
        <button id="prev">&lsaquo; Prev</button>
        <span id="pos">— / —</span>
        <button id="next">Next &rsaquo;</button>
        <span class="sep"></span>
        <button id="download">Download .pptx</button>
      </div>
      <div id="stage"></div>
      <p class="hint">
        Click any text on the slide and type. Text inherited from the layout or
        master is read-only. Select text and use the buttons to format it.
      </p>
    </div>
    <div id="info"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
